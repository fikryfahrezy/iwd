pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{css,html,json,js,jsx,md,mjs,ts,tsx,yaml,yml}"
      run: bunx oxfmt --write {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{js,jsx,mjs,ts,tsx}"
      run: bunx eslint --max-warnings=0 {staged_files}
    typecheck:
      run: bun run typecheck
